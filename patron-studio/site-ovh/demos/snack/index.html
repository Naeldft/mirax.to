<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      /* Arrivée depuis l'accueil Patrôn Studio : la page démarre sur la même capture plein écran
         que la fin de la transition (l'écran de chargement de la démo reste caché), puis la capture
         s'efface en fondu dès que la démo est prête (signal « ps-demo-prete » du Loader). */
      (function () {
        try {
          var v = sessionStorage.getItem('ps-arrivee');
          if (!v) return;
          sessionStorage.removeItem('ps-arrivee');
          var p = v.split('|');
          if (!/^[a-z-]+$/.test(p[0]) || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          window.psArrivee = true;
          var d = document.createElement('div');
          d.setAttribute('aria-hidden', 'true');
          // arrivée depuis la carte de l'accueil : exactement la première image du film, plein écran, cadrage centré
          d.style.cssText = 'position:fixed;inset:0;z-index:2147483647;pointer-events:none;background:#000 url("./sequence/ordi/001.webp") center/cover no-repeat';
          document.documentElement.appendChild(d);
          // au-dessus de tout ce que la démo affichera (même niveau d'empilement : le dernier gagne)
          document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(d); });
          var fini = false;
          // la démo a dessiné cette même image dans son canvas : on retire l'image d'attente d'un coup, sans fondu
          var fin = function () {
            if (fini) return;
            fini = true;
            d.remove();
          };
          addEventListener('ps-demo-prete', fin);
          setTimeout(fin, 4000); // sécurité
        } catch (e) { /* pas de stockage : rien à faire */ }
      })();
    </script>
    <meta name="theme-color" content="#0d0b0a" />
    <title>Crunch! — Smash burgers & frites maison à Lille</title>
    <meta name="description" content="Crunch!, snack à Lille Wazemmes : smash burgers, tenders, frites maison. Commande à emporter en ligne, retrait en 15 minutes, livraison dans Lille." />

    <link rel="preload" as="image" type="image/webp" href="./sequence/ordi/001.webp" fetchpriority="high" />

    <link rel="stylesheet" crossorigin href="./assets/index-Duf4vmWQ.css">
