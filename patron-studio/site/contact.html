<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#f6f6f0">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Écrire au studio | Patrôn Studio</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml"><link rel="icon" href="./favicon.ico" sizes="48x48"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="manifest" href="./site.webmanifest">
<meta name="description" content="Écrivez à Patrôn Studio : une question, un projet de site ou une demande de devis. Réponse rapide, sans engagement.">
<link rel="canonical" href="https://xn--patrn-studio-hib.fr/contact.html">
<link rel="stylesheet" href="./site-app.css">
<link rel="stylesheet" href="./contact-form.css">
<script src="./export-config.js"></script>
<script src="./contact-form.js" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Aller au contenu</a>
<header class="header"><a href="./index.html" class="wordmark" aria-label="Patrôn Studio, accueil">patrôn<span>STUDIO<br>DIGITAL</span><i></i></a></header>
<main id="main" class="wrap content-bottom prose-page">
  <div class="page-head">
    <p class="eyebrow">Patrôn Studio · Lille</p>
    <h1>Écrire au studio.</h1>
    <p>Une question, un projet, une demande de devis : laissez-nous un moyen de vous recontacter, nous répondons rapidement.</p>
  </div>
  <!-- Fonctionne sans JavaScript : envoi direct à Web3Forms, puis retour sur merci.html. Avec JavaScript, contact-form.js remplace ce formulaire (envoi sans rechargement). -->
  <form id="psf-page" class="psf-form psf-page" action="https://api.web3forms.com/submit" method="POST">
    <input type="hidden" name="access_key" value="69a6708d-d4be-4c28-98f1-8e08442ae8d7">
    <input type="hidden" name="subject" value="Nouvelle demande Patrôn Studio">
    <input type="hidden" name="from_name" value="Site Patrôn Studio">
    <input type="hidden" name="redirect" value="https://xn--patrn-studio-hib.fr/merci.html">
    <div class="psf-fields">
      <label class="psf-field"><span>Votre nom *</span><input name="name" autocomplete="name" required maxlength="120"></label>
      <label class="psf-field"><span>E-mail ou téléphone pour vous recontacter *</span><input name="contact" autocomplete="email" required maxlength="160" placeholder="vous@exemple.fr ou 06 12 34 56 78"></label>
      <label class="psf-field"><span>Votre message *</span><textarea name="message" rows="5" required maxlength="3000" placeholder="Votre activité, votre projet, vos questions…"></textarea></label>
      <label class="psf-hp" aria-hidden="true">Ne pas cocher <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off"></label>
    </div>
    <p class="psf-note">Vos coordonnées servent uniquement à vous répondre. <a href="./confidentialite.html">Confidentialité</a></p>
    <div class="psf-actions"><button type="submit" class="psf-submit">Envoyer au studio</button></div>
  </form>
  <p style="margin-top:28px"><a href="./index.html">Revenir à l’accueil</a></p>
</main>
</body>
</html>
